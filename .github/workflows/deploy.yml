name: Deploy

on:
  release:
    types: [created]
  workflow_dispatch:

defaults:
  run:
    shell: pwsh

jobs:
  version:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: version
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          if ($version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$') { throw "Invalid release version: $version" }
          "version=$version" >> $env:GITHUB_OUTPUT

  tool-packages:
    needs: version
    uses: ./.github/workflows/tool-packages.yml
    with:
      version: ${{ needs.version.outputs.version }}
    permissions:
      contents: read

  build-and-test:
    needs: [version, tool-packages]
    runs-on: ubuntu-latest
    env:
      PACKAGE_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: "./global.json"
          # The library consumer in the package smoke test also runs on net8.0.
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Test release revision
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          dotnet test -c Release --no-restore --verbosity minimal

      - name: Download tested tool packages
        uses: actions/download-artifact@v8
        with:
          name: tool-packages
          path: ./PackedNuget

      - name: Pack
        if: startsWith(github.ref, 'refs/tags/v')
        run: ./eng/pack.ps1 -Mode Libraries -Version $env:PACKAGE_VERSION -Output ./PackedNuget

      - name: Verify packages
        if: startsWith(github.ref, 'refs/tags/v')
        run: ./eng/verify-packages.ps1 -Feed ./PackedNuget -Version $env:PACKAGE_VERSION

      - name: Smoke test packages
        if: startsWith(github.ref, 'refs/tags/v')
        run: ./eng/smoke-test-packages.ps1 -Feed ./PackedNuget -Version $env:PACKAGE_VERSION -ExpectedRid linux-x64 -Library

      - name: Upload Artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: NuGet
          path: ${{ github.workspace }}/PackedNuget

  deploy:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [version, build-and-test]
    environment:
      name: "Production"
      url: "https://www.nuget.org/packages/VS.TestPlaylistTools"
    name: Push NuGets
    permissions:
      id-token: write   # Required for OIDC token (NuGet trusted publishing)
      contents: read
      actions: read     # Required for actions/download-artifact
      attestations: write
      artifact-metadata: write

    steps:
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Download artifact from build job
        uses: actions/download-artifact@v8
        with:
          name: NuGet

      - name: NuGet login (OIDC)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}  # nuget.org profile name (NOT email)

      - name: Attest NuGet packages (best effort)
        continue-on-error: true
        uses: actions/attest@v4
        with:
          subject-path: '${{ github.workspace }}/*.nupkg'

      - name: Push NuGet
        env:
          PACKAGE_VERSION: ${{ needs.version.outputs.version }}
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $tagVersion = $env:PACKAGE_VERSION
          $source = "https://api.nuget.org/v3/index.json"
          $apiKey = $env:NUGET_API_KEY

          dotnet nuget push VSTestPlaylistTools.$tagVersion.nupkg --source $source --api-key $apiKey --skip-duplicate
          dotnet nuget push VSTestPlaylistTools.TrxToPlaylistConverter.$tagVersion.nupkg --source $source --api-key $apiKey --skip-duplicate

          # Push RID-specific packages before the top-level pointer package.
          # This ordering is required: the top-level package references the RID packages,
          # so they must exist on the feed first.
          # https://learn.microsoft.com/dotnet/core/tools/rid-specific-tools#publish-your-tool
          # Discover packages dynamically so the workflow stays in sync with the csproj RID list.
          Get-ChildItem "trx-to-vsplaylist.*.*.nupkg" | Where-Object { $_.Name -notmatch "^trx-to-vsplaylist\.\d" } | ForEach-Object {
            dotnet nuget push $_.Name --source $source --api-key $apiKey --skip-duplicate
          }
          dotnet nuget push trx-to-vsplaylist.$tagVersion.nupkg --source $source --api-key $apiKey --skip-duplicate
