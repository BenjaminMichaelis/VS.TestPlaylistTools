name: Deploy

on:
  release:
    types: [created]
  workflow_dispatch:
  schedule:
    - cron: '5 10 * * *'

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  check-for-changes:
    runs-on: ubuntu-latest
    outputs:
      changes: ${{ steps.check.outputs.changes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check for changes
        id: check
        run: |
          if ($env:GITHUB_EVENT_NAME -in @('release', 'workflow_dispatch')) {
            Write-Host "Event '$env:GITHUB_EVENT_NAME' detected - forcing build and deployment."
            "changes=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          } else {
            try {
              # This repo publishes 3 packages that share one version. If any of them is
              # behind the latest commit, we still build/publish a nightly preview so the
              # CLI tool preview reflects the latest underlying library changes too.
              $packageIds = @(
                "vstestplaylisttools",
                "vstestplaylisttools.trxtoplaylistconverter",
                "trx-to-vsplaylist"
              )

              $latestCommitDate = [DateTimeOffset]::Parse((git log -1 --format=%cI)).UtcDateTime
              Write-Host "Latest commit date (UTC): $latestCommitDate"

              $hasChanges = $false

              foreach ($packageId in $packageIds) {
                try {
                  # Get the latest published package metadata from NuGet registration.
                  # Avoid [System.Version] parsing because prerelease versions are not compatible with that type.
                  $packageInfo = Invoke-RestMethod -Uri "https://api.nuget.org/v3/registration5-gz-semver2/$packageId/index.json"

                  $registrationPages = @($packageInfo.items)
                  $registrationItems = @()
                  foreach ($page in $registrationPages) {
                    if ($null -ne $page.items) {
                      $registrationItems += @($page.items)
                    } elseif ($null -ne $page.'@id') {
                      $pageResponse = Invoke-RestMethod -Uri $page.'@id'
                      foreach ($innerPage in @($pageResponse.items)) {
                        if ($null -ne $innerPage.items) {
                          $registrationItems += @($innerPage.items)
                        }
                      }
                    }
                  }

                  $publishedItems = $registrationItems | Where-Object { $null -ne $_.catalogEntry -and $null -ne $_.catalogEntry.published }
                  if (-not $publishedItems) {
                    Write-Host "No published versions found for '$packageId' - treating as changed."
                    $hasChanges = $true
                    continue
                  }

                  $latestPublishedItem = $publishedItems | Sort-Object { [DateTimeOffset]::Parse($_.catalogEntry.published).UtcDateTime } | Select-Object -Last 1
                  $lastPublishedDate = [DateTimeOffset]::Parse($latestPublishedItem.catalogEntry.published).UtcDateTime

                  Write-Host "Latest '$packageId' version: $($latestPublishedItem.catalogEntry.version)"
                  Write-Host "Last published date (UTC) for '$packageId': $lastPublishedDate"

                  if ($latestCommitDate -gt $lastPublishedDate) {
                    Write-Host "Repository has changes newer than the last published '$packageId' package"
                    $hasChanges = $true
                  }
                } catch {
                  Write-Warning "Failed to query NuGet registration feed for '$packageId': $($_.Exception.Message). Treating as changed."
                  $hasChanges = $true
                }
              }

              if ($hasChanges) {
                "changes=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
              } else {
                Write-Host "No changes since last published packages"
                "changes=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
              }
            } catch {
              Write-Error "Failed to determine NuGet publish state for nightly deploy: $($_.Exception.Message)"
              throw
            }
          }

  version:
    if: needs.check-for-changes.outputs.changes == 'true'
    runs-on: ubuntu-latest
    needs: check-for-changes
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - id: version
        name: Resolve shared release or nightly version
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          if ($env:GITHUB_REF -match '^refs/tags/[vV](.+)$') {
            $version = $Matches[1]
          } elseif ($env:GITHUB_EVENT_NAME -in @('schedule', 'workflow_dispatch')) {
            $tag = git describe --tags --abbrev=0
            if ($tag -notmatch '^[vV]?(\d+)\.(\d+)\.(\d+)(?:-[0-9A-Za-z.-]+)?$') { throw "Invalid base release tag: $tag" }
            $version = "$($Matches[1]).$($Matches[2]).$([int]$Matches[3] + 1)-beta.$env:GITHUB_RUN_NUMBER"
          } else {
            throw "Release must use a version tag: $env:GITHUB_REF"
          }
          if ($version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$') { throw "Invalid release version: $version" }
          "version=$version" >> $env:GITHUB_OUTPUT

  tool-packages:
    needs: version
    uses: ./.github/workflows/tool-packages.yml
    with:
      version: ${{ needs.version.outputs.version }}
    permissions:
      contents: read

  build-and-test:
    needs: [version, tool-packages]
    runs-on: ubuntu-latest
    env:
      PACKAGE_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: "./global.json"
          # The library consumer in the package smoke test also runs on net8.0.
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Test release revision
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          dotnet test -c Release --no-restore --verbosity minimal

      - name: Download tested tool packages
        uses: actions/download-artifact@v8
        with:
          name: tool-packages
          path: ./PackedNuget

      - name: Pack
        run: ./eng/pack.ps1 -Mode Libraries -Version $env:PACKAGE_VERSION -Output ./PackedNuget

      - name: Verify packages
        run: ./eng/verify-packages.ps1 -Feed ./PackedNuget -Version $env:PACKAGE_VERSION

      - name: Smoke test packages
        run: ./eng/smoke-test-packages.ps1 -Feed ./PackedNuget -Version $env:PACKAGE_VERSION -ExpectedRid linux-x64 -Library

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: NuGet
          path: ${{ github.workspace }}/PackedNuget

  deploy:
    runs-on: ubuntu-latest
    needs: [version, build-and-test]
    environment:
      name: "Production"
      url: "https://www.nuget.org/packages/VS.TestPlaylistTools"
    name: Push NuGets
    permissions:
      id-token: write   # Required for OIDC token (NuGet trusted publishing)
      contents: read
      actions: read     # Required for actions/download-artifact
      attestations: write
      artifact-metadata: write

    steps:
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Download artifact from build job
        uses: actions/download-artifact@v8
        with:
          name: NuGet

      - name: NuGet login (OIDC)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}  # nuget.org profile name (NOT email)

      - name: Attest NuGet packages (best effort)
        continue-on-error: true
        uses: actions/attest@v4
        with:
          subject-path: '${{ github.workspace }}/*.nupkg'

      - name: Push NuGet
        env:
          PACKAGE_VERSION: ${{ needs.version.outputs.version }}
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $tagVersion = $env:PACKAGE_VERSION
          $source = "https://api.nuget.org/v3/index.json"
          $apiKey = $env:NUGET_API_KEY

          dotnet nuget push VSTestPlaylistTools.$tagVersion.nupkg --source $source --api-key $apiKey --skip-duplicate
          dotnet nuget push VSTestPlaylistTools.TrxToPlaylistConverter.$tagVersion.nupkg --source $source --api-key $apiKey --skip-duplicate

          # Push RID-specific packages before the top-level pointer package.
          # This ordering is required: the top-level package references the RID packages,
          # so they must exist on the feed first.
          # https://learn.microsoft.com/dotnet/core/tools/rid-specific-tools#publish-your-tool
          # Discover packages dynamically so the workflow stays in sync with the csproj RID list.
          Get-ChildItem "trx-to-vsplaylist.*.*.nupkg" | Where-Object { $_.Name -notmatch "^trx-to-vsplaylist\.\d" } | ForEach-Object {
            dotnet nuget push $_.Name --source $source --api-key $apiKey --skip-duplicate
          }
          dotnet nuget push trx-to-vsplaylist.$tagVersion.nupkg --source $source --api-key $apiKey --skip-duplicate
